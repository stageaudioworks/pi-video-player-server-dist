<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{% endblock %} - {{ name }} - SAW manager</title>
<link rel="stylesheet" href="{{ url_for('static', filename='manager.css') }}">
<script>
(function(){var t=null;try{t=localStorage.getItem('sawTheme');}catch(e){}
if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
document.documentElement.setAttribute('data-theme',t);})();
</script>
</head>
<body>
<header>
  <h1>SAW manager &middot; {{ name }}</h1>
  <nav>
    <a href="/" class="{{ 'here' if page == 'units' }}">Units</a>
    <a href="/content" class="{{ 'here' if page == 'content' }}">Content</a>
    <a href="/software" class="{{ 'here' if page == 'software' }}">Software</a>
  </nav>
  <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Switch between light and dark"></button>
</header>
<div id="toast"></div>
{% block body %}{% endblock %}
<footer>
  A Stage Audio Works Innovation<br>
  <a class="saw-logo-link" href="https://stageaudioworks.com" target="_blank" rel="noopener noreferrer">{% include "_logo.html" %}</a>
  <div class="ver">Video player central manager v{{ version }}</div>
</footer>
<script src="{{ url_for('static', filename='manager.js') }}"></script>
<script>themeLabel();</script>
{% block script %}{% endblock %}
</body>
</html>
